@media(max-width:960px){#cursor-dot,#cursor-ring{display:none}body{cursor:auto}}

/* Progress bar */
#scroll-bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,#4ADE80,#38BDF8);z-index:9997;transform-origin:left;transform:scaleX(0);transition:transform 0.06s linear;box-shadow:0 0 8px #4ADE80;pointer-events:none;}

/* Image placeholder */
.img-ph{background:repeating-linear-gradient(-45deg,#0a0a18 0px,#0a0a18 10px,#080810 10px,#080810 20px);border-radius:8px;position:relative;overflow:hidden}
.img-ph span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#222238}

a{text-decoration:none;color:inherit}

/* Reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity 0.75s cubic-bezier(0.16,1,0.3,1),transform 0.75s cubic-bezier(0.16,1,0.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none!important;transition:none!important}}

/* Pulse */
@keyframes pulse-ring{
  0%{box-shadow:0 0 0 0 rgba(74,222,128,0.45)}
  70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
  100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
}
.pulse-dot{animation:pulse-ring 2.4s ease-out infinite}

/* Scan label */
.scan-label{position:relative;overflow:hidden}
.scan-label::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(74,222,128,0.07),transparent);transform:translateX(-100%);animation:scan-sweep 4s ease-in-out infinite;pointer-events:none;}
@keyframes scan-sweep{0%{transform:translateX(-100%)} 50%{transform:translateX(200%)} 100%{transform:translateX(200%)}}

/* Nav hamburger */
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:transparent;border:none;z-index:201}
.nav-hamburger span{display:block;width:22px;height:1.5px;background:#9090A8;border-radius:1px;transition:transform 0.3s cubic-bezier(0.16,1,0.3,1),opacity 0.3s}

}

/* Document preview */
.doc-card{

.doc-btn{

  transition:all 0.2s;border:none;
}
@media(max-width:600px){
  .doc-grid{grid-template-columns:1fr!important}
  .section-pad{padding-left:20px!important;padding-right:20px!important}
}

<script>
/* Deep Space Background */
(function() {
  if (!window.THREE) return;
  const THREE = window.THREE;
  const canvas = document.getElementById('space-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x04040A, 1);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 2000);
  camera.position.z = 400;
  const isMobile = window.innerWidth < 768;
  const dimVert = `attribute float phase;attribute float baseSize;uniform float uTime;varying float vAlpha;void main(){float pulse=0.90+0.10*sin(uTime*0.7+phase);vAlpha=pulse;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=baseSize*(300.0/-mv.z);gl_Position=projectionMatrix*mv;}`;
  const dimFrag = `varying float vAlpha;uniform vec3 uColor;void main(){float d=length(gl_PointCoord-0.5)*2.0;float core=1.0-smoothstep(0.0,0.55,d);gl_FragColor=vec4(uColor,core*vAlpha);}`;
  const brightVert = `attribute float phase;attribute float baseSize;uniform float uTime;varying float vAlpha;void main(){float pulse=0.82+0.18*sin(uTime*1.1+phase);vAlpha=pulse;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=baseSize*(300.0/-mv.z)*pulse;gl_Position=projectionMatrix*mv;}`;
  const brightFrag = `varying float vAlpha;uniform vec3 uColor;void main(){float d=length(gl_PointCoord-0.5)*2.0;float core=pow(1.0-smoothstep(0.0,0.22,d),1.4);float halo=pow(1.0-smoothstep(0.0,1.0,d),2.8)*0.55;gl_FragColor=vec4(uColor,(core+halo)*vAlpha);}`;
  function makeStars(count,spread,baseSize,color,zRange,vert,frag,spreadY){
    const geo=new THREE.BufferGeometry();const pos=new Float32Array(count*3);const phase=new Float32Array(count);const sizes=new Float32Array(count);const sy=spreadY!==undefined?spreadY:spread*0.65;
    for(let i=0;i<count;i++){pos[i*3]=(Math.random()-0.5)*spread;pos[i*3+1]=(Math.random()-0.5)*sy;pos[i*3+2]=-Math.random()*zRange;phase[i]=Math.random()*Math.PI*2;sizes[i]=baseSize*(0.45+Math.random()*0.55);}
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('phase',new THREE.BufferAttribute(phase,1));geo.setAttribute('baseSize',new THREE.BufferAttribute(sizes,1));
    const mat=new THREE.ShaderMaterial({vertexShader:vert,fragmentShader:frag,uniforms:{uTime:{value:0},uColor:{value:new THREE.Color(color)}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
    return new THREE.Points(geo,mat);
  }
  const D=dimVert,dF=dimFrag,B=brightVert,bF=brightFrag;
  const starSystems=[
    makeStars(isMobile?1200:5000,2600,0.9,0xffffff,2000,D,dF),
    makeStars(isMobile?400:2000,2400,1.0,0xd8e4ff,1800,D,dF),
    makeStars(isMobile?200:900,1800,2.0,0xffffff,1400,B,bF),
    makeStars(isMobile?80:400,1600,2.4,0xddeeff,1200,B,bF),
    makeStars(isMobile?30:120,900,5.0,0xffffff,600,B,bF),
    makeStars(isMobile?10:45,650,4.2,0x4ADE80,400,B,bF),
    makeStars(isMobile?10:40,600,4.0,0x38BDF8,380,B,bF),
  ];
  starSystems.forEach(s=>scene.add(s));
  let targetZ=400,currentZ=400,mx=0,my=0,frame=0,t=0;
  window.addEventListener('scroll',()=>{const p=window.scrollY/(document.body.scrollHeight-window.innerHeight||1);targetZ=400-p*800;const bar=document.getElementById('scroll-bar');if(bar)bar.style.transform=`scaleX(${p})`;},{passive:true});
  if(!isMobile)window.addEventListener('mousemove',e=>{mx=(e.clientX/window.innerWidth-0.5)*0.4;my=(e.clientY/window.innerHeight-0.5)*0.25;});
  window.addEventListener('resize',()=>{renderer.setSize(window.innerWidth,window.innerHeight);camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();});
  renderer.setSize(window.innerWidth,window.innerHeight);
  (function animate(){requestAnimationFrame(animate);t+=0.009;frame++;currentZ+=(targetZ-currentZ)*0.04;camera.position.z=currentZ;camera.rotation.y+=(mx*0.03-camera.rotation.y)*0.04;camera.rotation.x+=(-my*0.02-camera.rotation.x)*0.04;camera.position.x+=Math.sin(frame*0.0003)*0.04;camera.position.y+=Math.cos(frame*0.0004)*0.03;starSystems.forEach(s=>{s.material.uniforms.uTime.value=t;});renderer.render(scene,camera);})();
})();
</script>

<script>
(function(){
  const dot=document.getElementById('cursor-dot');
  const ring=document.getElementById('cursor-ring');
  if(!dot)return;
  let rx=0,ry=0,tx=0,ty=0;
  document.addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;dot.style.left=tx+'px';dot.style.top=ty+'px'});
  (function lerp(){rx+=(tx-rx)*0.13;ry+=(ty-ry)*0.13;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lerp)})();
})();
</script>

<script type="text/babel">

function ImgPh({label,style={},className='',slots=1}){
  const[idx,setIdx]=React.useState(0);
  const go=(dir,e)=>{if(e)e.stopPropagation();setIdx(i=>(i+dir+slots)%slots);};
  return(
    <div className={`img-ph${className?' '+className:''}`} style={style}>
      <span style={{zIndex:1}}>{label}{slots>1?` · ${idx+1}/${slots}`:''}</span>
      {slots>1&&<>
        <button onClick={e=>go(-1,e)} aria-label="Previous image"
          style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',background:'rgba(4,4,10,0.85)',border:'1px solid rgba(255,255,255,0.14)',color:'#9090A8',borderRadius:4,width:28,height:28,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,zIndex:3,lineHeight:1,padding:0}}>&#8592;</button>
        <button onClick={e=>go(1,e)} aria-label="Next image"
          style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'rgba(4,4,10,0.85)',border:'1px solid rgba(255,255,255,0.14)',color:'#9090A8',borderRadius:4,width:28,height:28,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,zIndex:3,lineHeight:1,padding:0}}>&#8594;</button>
        <div style={{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',display:'flex',gap:4,zIndex:3}}>
          {Array.from({length:slots}).map((_,i)=>(
            <div key={i} onClick={e=>{e.stopPropagation();setIdx(i);}}
              style={{width:i===idx?14:5,height:5,borderRadius:3,background:i===idx?'#4ADE80':'rgba(255,255,255,0.25)',cursor:'pointer',transition:'all 0.25s'}}/>
          ))}

      </>}

  );
}
