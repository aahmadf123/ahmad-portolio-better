<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmad Firas — AI Researcher &amp; Engineer</title>
<meta name="description" content="Ahmad Firas — AI Researcher, Microsoft Solution Developer. Building agentic AI, autonomous UAV systems, and production-grade ML infrastructure.">
<meta name="theme-color" content="#04040A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:#04040A;color:#D0D0E0;
  font-family:'Space Grotesk',sans-serif;
  line-height:1.7;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  cursor:none;
}
::selection{background:rgba(74,222,128,0.18);color:#fff}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#04040A}
::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:2px}

/* Deep-space fixed canvas */
#space-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:0;
}
/* All content above canvas */
#app-root{position:relative;z-index:1}

/* Section color washes — tinted overlays per section depth */
.section-wash{
  position:relative;
}
.section-wash::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
}
.wash-void::before    { background:rgba(4,4,10,0.72); }
.wash-deep::before    { background:rgba(6,4,18,0.68); }
.wash-nebula::before  { background:rgba(10,4,22,0.66); }
.wash-cluster::before { background:rgba(4,10,20,0.68); }
.wash-pulse::before   { background:rgba(4,16,12,0.68); }
.wash-warm::before    { background:rgba(18,8,4,0.68); }
.wash-cold::before    { background:rgba(4,8,20,0.70); }
.wash-home::before    { background:rgba(6,12,8,0.70); }

.section-inner{position:relative;z-index:1}

/* Cursor */
#cursor-dot{width:8px;height:8px;background:#4ADE80;border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:screen;transition:background 0.2s}
#cursor-ring{width:32px;height:32px;border:1px solid rgba(74,222,128,0.3);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width 0.25s,height 0.25s}
body:has(a:hover) #cursor-ring,body:has(button:hover) #cursor-ring{width:50px;height:50px;border-color:rgba(74,222,128,0.5)}
@media(max-width:960px){#cursor-dot,#cursor-ring{display:none}body{cursor:auto}}

/* Image placeholder */
.img-ph{background:repeating-linear-gradient(-45deg,#0a0a18 0px,#0a0a18 10px,#080810 10px,#080810 20px);border-radius:8px;position:relative;overflow:hidden}
.img-ph span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#222238}
a{text-decoration:none;color:inherit}

/* Reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity 0.75s cubic-bezier(0.16,1,0.3,1),transform 0.75s cubic-bezier(0.16,1,0.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}
.reveal-d1{transition-delay:0.1s}.reveal-d2{transition-delay:0.18s}.reveal-d3{transition-delay:0.26s}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none!important;transition:none!important}}

/* Tilt */
.tilt{transition:transform 0.25s ease,box-shadow 0.25s ease}
.tilt:hover{box-shadow:0 20px 48px rgba(0,0,0,0.5)}

/* Cert card */
.cert-card{
  background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:10px;padding:18px 20px;
  transition:all 0.25s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer;
}
.cert-card:hover{background:rgba(255,255,255,0.04);border-color:rgba(56,189,248,0.25);transform:translateY(-2px)}

@media(max-width:960px){
  .hero-split{flex-direction:column!important}
  .hero-right{flex:none!important;width:100%!important;height:300px!important;border-left:none!important;border-top:1px solid rgba(255,255,255,0.06)!important}
  .two-col{grid-template-columns:1fr!important;gap:36px!important}
  .three-col{grid-template-columns:1fr 1fr!important}
  .section-pad{padding-left:24px!important;padding-right:24px!important}
}
@media(max-width:600px){
  .three-col{grid-template-columns:1fr!important}
  .proj-meta{display:none!important}
  .cert-grid{grid-template-columns:1fr!important}
}

/* ── RESPONSIVE ADDITIONS ─────────────────────────────────────────────── */

/* iOS/Android text scaling fix */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* iOS notch safe areas */
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

/* All section padding — override inline styles on mobile */
@media(max-width:960px){
  section.section-wash{padding-left:32px!important;padding-right:32px!important}
}
@media(max-width:768px){
  section.section-wash{padding-left:24px!important;padding-right:24px!important;padding-top:72px!important;padding-bottom:56px!important}
}
@media(max-width:480px){
  section.section-wash{padding-left:16px!important;padding-right:16px!important;padding-top:56px!important;padding-bottom:44px!important}
}

/* Nav hamburger */
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:transparent;border:none;z-index:201}
.nav-hamburger span{display:block;width:22px;height:1.5px;background:#9090A8;border-radius:1px;transition:transform 0.3s cubic-bezier(0.16,1,0.3,1),opacity 0.3s}
@media(max-width:768px){
  .nav-hamburger{display:flex!important}
  .nav-links{display:none;position:fixed;top:60px;left:0;right:0;background:rgba(4,4,10,0.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);flex-direction:column!important;align-items:flex-start!important;padding:12px 28px 28px;gap:0!important;border-bottom:1px solid rgba(255,255,255,0.07);z-index:199}
  .nav-links.open{display:flex!important}
  .nav-links a{padding:14px 0!important;width:100%;border-bottom:1px solid rgba(255,255,255,0.05)!important;font-size:13px!important;letter-spacing:0.06em!important}
  .nav-links a:last-child{border-bottom:none!important}
}

/* Currently 4-col → 2 → 1 */
@media(max-width:960px){.four-col{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:480px){.four-col{grid-template-columns:1fr!important}}

/* Experience timeline */
@media(max-width:768px){
  .exp-row{grid-template-columns:1fr!important;gap:4px!important;padding-left:20px!important}
  .exp-meta{display:none!important}
}

/* Research featured-in panel */
@media(max-width:768px){
  .featured-grid{grid-template-columns:1fr!important}
}

/* Cert grid */
@media(max-width:480px){.cert-grid{grid-template-columns:1fr!important}}

/* Hero right photo panel — smaller on very small phones */
@media(max-width:480px){.hero-right{height:180px!important}}

/* Disable 3D tilt on touch devices (no hover support) */
@media(hover:none){
  .tilt:hover{box-shadow:none!important}
}

/* Scrollbar — hide on mobile */
@media(max-width:768px){
  ::-webkit-scrollbar{width:0}
}

/* Reduce motion: already handled — ensure consistency */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .reveal{opacity:1!important;transform:none!important}
}

/* ── SCROLL PROGRESS BAR ─────────────────────────────────────────────── */
#scroll-bar{
  position:fixed;top:0;left:0;height:2px;
  background:linear-gradient(90deg,#4ADE80,#38BDF8);
  z-index:9997;transform-origin:left;transform:scaleX(0);
  transition:transform 0.06s linear;
  box-shadow:0 0 8px #4ADE80;
  pointer-events:none;
}

/* ── PULSE DOT ───────────────────────────────────────────────────────── */
@keyframes pulse-ring{
  0%{box-shadow:0 0 0 0 rgba(74,222,128,0.45)}
  70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}
  100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
}
.pulse-dot{animation:pulse-ring 2.4s ease-out infinite}

/* ── SCAN LABEL ──────────────────────────────────────────────────────── */
.scan-label{position:relative;overflow:hidden}
.scan-label::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(74,222,128,0.07),transparent);
  transform:translateX(-100%);
  animation:scan-sweep 4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes scan-sweep{
  0%{transform:translateX(-100%)} 50%{transform:translateX(200%)} 100%{transform:translateX(200%)}
}

/* ── HORIZONTAL EXPERIENCE TIMELINE ─────────────────────────────────── */
.timeline-track{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  gap:0;
}
.timeline-track::-webkit-scrollbar{display:none}
.timeline-card{
  scroll-snap-align:start;
  flex:0 0 clamp(280px,36vw,460px);
  padding:28px 36px 28px 0;
  position:relative;
}
.timeline-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:rgba(255,255,255,0.07);
  transition:background 0.4s;
}
.timeline-card.active-card::before{background:var(--card-color,#4ADE80)}
.timeline-dot{
  width:10px;height:10px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.2);
  flex-shrink:0;margin-top:4px;
  transition:border-color 0.3s,box-shadow 0.3s;
}
.timeline-card.active-card .timeline-dot{
  border-color:var(--card-color,#4ADE80);
  box-shadow:0 0 12px var(--card-color,#4ADE80);
}
.timeline-arrow{
  width:36px;height:36px;border-radius:6px;
  border:1px solid rgba(255,255,255,0.07);
  background:transparent;color:#9090A8;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:16px;line-height:1;
  transition:border-color 0.2s,color 0.2s,background 0.2s;
}
.timeline-arrow:hover{border-color:rgba(74,222,128,0.35);color:#4ADE80;background:rgba(74,222,128,0.04)}
.timeline-arrow:disabled{opacity:0.2;cursor:default;pointer-events:none}
@media(max-width:768px){.timeline-card{flex:0 0 85vw}}

/* ── VIEW TRANSITIONS — project expand ───────────────────────────────── */
::view-transition-old(proj-expand),
::view-transition-new(proj-expand){
  animation-duration:0.38s;
  animation-timing-function:cubic-bezier(0.16,1,0.3,1);
}

/* ── HERO WASH — transparent so particles show ─────────────────────── */
#hero.wash-void::before{background:rgba(4,4,10,0.45)!important}
</style>

</head>
<body>
<div id="scroll-bar"></div>
<canvas id="space-canvas"></canvas>
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<div id="app-root"><div id="root"></div></div>

<script>
/* ── Deep Space Scrolling Background ────────────────────────────────────── */
(function() {
  if (!window.THREE) return;
  const THREE = window.THREE;
  const canvas = document.getElementById('space-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x04040A, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 2000);
  camera.position.z = 400;

  // Star layers — different depths, sizes, colors
  // Reduce particle count on mobile for better performance
  const isMobile = window.innerWidth < 768;

  // ── GLSL SHADER STARS — soft glow with sinusoidal pulse ────────────────
  const starVert = `
    attribute float phase;
    attribute float baseSize;
    uniform float uTime;
    varying float vAlpha;
    void main(){
      float pulse = 0.78 + 0.22 * sin(uTime * 1.3 + phase);
      vAlpha = pulse;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = baseSize * (300.0 / -mv.z) * pulse;
      gl_Position = projectionMatrix * mv;
    }
  `;
  const starFrag = `
    varying float vAlpha;
    uniform vec3 uColor;
    void main(){
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float glow = pow(1.0 - smoothstep(0.0, 1.0, d), 1.7);
      gl_FragColor = vec4(uColor, glow * vAlpha * 0.9);
    }
  `;
  function makeGlowStars(count, spread, baseSize, color, zRange) {
    const geo = new THREE.BufferGeometry();
    const pos   = new Float32Array(count * 3);
    const phase = new Float32Array(count);
    const sizes = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      pos[i*3]   = (Math.random()-0.5)*spread;
      pos[i*3+1] = (Math.random()-0.5)*spread*0.6;
      pos[i*3+2] = -Math.random()*zRange;
      phase[i]   = Math.random()*Math.PI*2;
      sizes[i]   = baseSize * (0.5 + Math.random()*0.5);
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos,   3));
    geo.setAttribute('phase',    new THREE.BufferAttribute(phase,  1));
    geo.setAttribute('baseSize', new THREE.BufferAttribute(sizes,  1));
    const mat = new THREE.ShaderMaterial({
      vertexShader: starVert, fragmentShader: starFrag,
      uniforms: { uTime:{value:0}, uColor:{value:new THREE.Color(color)} },
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    });
    return new THREE.Points(geo, mat);
  }

  const starSystems = [
    makeGlowStars(isMobile?700:3200,  1800, 1.8, 0xaaaacc, 1600),
    makeGlowStars(isMobile?200:900,   1200, 2.6, 0xccccff, 1200),
    makeGlowStars(isMobile?70:350,    800,  3.4, 0x88bbff, 600),
    makeGlowStars(isMobile?14:60,     600,  4.5, 0x4ADE80, 400),
    makeGlowStars(isMobile?10:45,     700,  3.8, 0xFB923C, 500),
    makeGlowStars(isMobile?10:50,     650,  4.0, 0x38BDF8, 450),
  ];
  starSystems.forEach(s => scene.add(s));

  // ── PARTICLE FORMATION — letters assemble from scattered field ──────────
  let particleSystem = null;
  let particleTargets = [];
  // 'assembling' → fly toward targets | 'holding' → stay put | 'dispersing' → fly out | 'dispersed' → idle
  let pfPhase = 'assembling';
  let pfScrolledPast = false; // true once user scrolls past hero

  function initParticles() {
    // Wait for React to render the h1 into the DOM
    const h1 = document.querySelector('#hero h1');
    if (!h1) { setTimeout(initParticles, 120); return; }
    const rect = h1.getBoundingClientRect();
    if (!rect.width || !rect.height) { setTimeout(initParticles, 120); return; }

    const DEPTH = 340;

    // Convert screen pixel → 3-D world position at z=DEPTH
    function s2w(sx, sy) {
      const ndcX =  (sx / window.innerWidth)  * 2 - 1;
      const ndcY = -(sy / window.innerHeight) * 2 + 1;
      const v = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
      const d = v.sub(camera.position).normalize();
      const t = (DEPTH - camera.position.z) / d.z;
      return { x: camera.position.x + d.x * t, y: camera.position.y + d.y * t };
    }

    // Sample letter shapes into an offscreen canvas sized to the actual h1
    const fs = Math.round(parseFloat(window.getComputedStyle(h1).fontSize)) || 96;
    const W  = Math.min(Math.round(rect.width),  900)  || 600;
    const H  = Math.min(Math.round(rect.height), 400)  || 250;
    const off = document.createElement('canvas');
    off.width  = W;
    off.height = H;
    const ctx = off.getContext('2d');
    ctx.font = `700 ${fs}px "Space Grotesk", sans-serif`;
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff';
    ctx.fillText('Ahmad', 0, 0);
    ctx.fillStyle = '#4ADE80';
    ctx.fillText('Firas',  0, fs * 0.92); // match lineHeight:0.88

    const data = ctx.getImageData(0, 0, W, H).data;
    particleTargets = [];
    const posList = [], colorList = [], phaseList = [], speedList = [];
    const step = isMobile ? 6 : 4;

    for (let py = 0; py < H; py += step) {
      for (let px = 0; px < W; px += step) {
        if (data[(py * W + px) * 4 + 3] > 100) {
          const isGreen = data[(py * W + px) * 4 + 1] > data[(py * W + px) * 4] * 1.5;
          // Map canvas pixel to the exact screen position of the h1
          const sx = rect.left + (px / W) * rect.width;
          const sy = rect.top  + (py / H) * rect.height;
          const { x: wx, y: wy } = s2w(sx, sy);
          particleTargets.push({ x: wx, y: wy, isGreen });
          const a = Math.random() * Math.PI * 2, d = 10 + Math.random() * 35;
          posList.push(wx + Math.cos(a) * d, wy + Math.sin(a) * d, DEPTH + (Math.random() - 0.5) * 20);
          colorList.push(isGreen ? 0.29 : 1, isGreen ? 0.87 : 1, isGreen ? 0.5 : 1);
          phaseList.push(Math.random() * Math.PI * 2);
          speedList.push(0.036 + Math.random() * 0.024);
        }
      }
    }

    if (!particleTargets.length) { setTimeout(initParticles, 200); return; }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(posList),  3));
    geo.setAttribute('aColor',   new THREE.BufferAttribute(new Float32Array(colorList), 3));
    geo.setAttribute('phase',    new THREE.BufferAttribute(new Float32Array(phaseList), 1));
    geo.setAttribute('speed',    new THREE.BufferAttribute(new Float32Array(speedList), 1));

    const pVert = `
      attribute vec3 aColor; attribute float phase; attribute float speed;
      uniform float uTime; varying vec3 vColor; varying float vAlpha;
      void main(){
        vColor = aColor;
        float pulse = 0.65 + 0.35 * sin(uTime * 1.8 + phase);
        vAlpha = pulse;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = 3.2 * (300.0 / -mv.z) * pulse;
        gl_Position = projectionMatrix * mv;
      }`;
    const pFrag = `
      varying vec3 vColor; varying float vAlpha;
      void main(){
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float g = pow(1.0 - smoothstep(0.0, 1.0, d), 1.6);
        gl_FragColor = vec4(vColor, g * vAlpha);
      }`;
    const pMat = new THREE.ShaderMaterial({
      vertexShader: pVert, fragmentShader: pFrag,
      uniforms: { uTime: { value: 0 } },
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    particleSystem = new THREE.Points(geo, pMat);
    scene.add(particleSystem);
  }
  document.fonts.ready.then(() => setTimeout(initParticles, 350));

  // Scroll depth control — maps scroll progress to camera Z
  let targetZ = 400;
  let currentZ = 400;
  let mx = 0, my = 0;
  let frame = 0;

  function onScroll() {
    const scrolled = window.scrollY;
    const total = document.body.scrollHeight - window.innerHeight;
    const progress = total > 0 ? scrolled / total : 0;
    // Camera travels from z=400 (surface) to z=-1200 (deep field)
    targetZ = 400 - progress * 1600;
    // Scroll progress bar
    const bar = document.getElementById('scroll-bar');
    if (bar) bar.style.transform = `scaleX(${progress})`;
    // Particle scroll detection
    const nowPast = scrolled > window.innerHeight * 0.45;
    if (nowPast && !pfScrolledPast) {
      pfScrolledPast = true;
      // Start dispersing only if assembled or holding
      if (pfPhase === 'holding' || pfPhase === 'assembling') pfPhase = 'dispersing';
    } else if (!nowPast && pfScrolledPast) {
      pfScrolledPast = false;
      // Scrolled back — scatter and reassemble
      if (particleSystem && (pfPhase === 'dispersing' || pfPhase === 'dispersed')) {
        const pos = particleSystem.geometry.attributes.position.array;
        for (let i = 0; i < particleTargets.length; i++) {
          const a = Math.random()*Math.PI*2, d = 10+Math.random()*35;
          pos[i*3]   = particleTargets[i].x + Math.cos(a)*d;
          pos[i*3+1] = particleTargets[i].y + Math.sin(a)*d;
        }
        particleSystem.geometry.attributes.position.needsUpdate = true;
        pfPhase = 'assembling';
      }
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });

  // Mouse parallax — desktop only (touch devices have no hover)
  if (!isMobile) {
    window.addEventListener('mousemove', e => {
      mx = (e.clientX / window.innerWidth  - 0.5) * 0.4;
      my = (e.clientY / window.innerHeight - 0.5) * 0.25;
    });
  }

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
  renderer.setSize(window.innerWidth, window.innerHeight);

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.009;
    frame++;
    // Smooth camera zoom
    currentZ += (targetZ - currentZ) * 0.04;
    camera.position.z = currentZ;
    // Gentle mouse parallax on camera rotation
    camera.rotation.y += (mx * 0.03 - camera.rotation.y) * 0.04;
    camera.rotation.x += (-my * 0.02 - camera.rotation.x) * 0.04;
    // Slow drift
    camera.position.x += Math.sin(frame * 0.0003) * 0.04;
    camera.position.y += Math.cos(frame * 0.0004) * 0.03;
    // Update star shader time for glow pulse
    starSystems.forEach(s => { s.material.uniforms.uTime.value = t; });
    // Update particle formation
    if (particleSystem && particleTargets.length) {
      particleSystem.material.uniforms.uTime.value = t;
      // Keep visible a bit past hero so disperse is seen
      particleSystem.visible = window.scrollY < window.innerHeight * 1.1;

      if (pfPhase !== 'dispersed') {
        const pos = particleSystem.geometry.attributes.position.array;
        const spd = particleSystem.geometry.attributes.speed.array;
        const DEPTH = 340;

        if (pfPhase === 'assembling') {
          let allArrived = true;
          for (let i = 0; i < particleTargets.length; i++) {
            const dx = particleTargets[i].x - pos[i*3];
            const dy = particleTargets[i].y - pos[i*3+1];
            const dz = DEPTH - pos[i*3+2];
            pos[i*3]   += dx * spd[i];
            pos[i*3+1] += dy * spd[i];
            pos[i*3+2] += dz * 0.05;
            if (Math.abs(dx) + Math.abs(dy) > 1.5) allArrived = false;
          }
          particleSystem.geometry.attributes.position.needsUpdate = true;
          if (allArrived) pfPhase = 'holding';

        } else if (pfPhase === 'holding') {
          // Particles stay — tiny drift to keep them alive (no position update needed)
          // phase is only exited by scroll (set to 'dispersing' in onScroll)

        } else if (pfPhase === 'dispersing') {
          let allGone = true;
          for (let i = 0; i < particleTargets.length; i++) {
            // Each particle flies outward from its target center
            const cx = pos[i*3]   - particleTargets[i].x;
            const cy = pos[i*3+1] - particleTargets[i].y;
            const len = Math.sqrt(cx*cx + cy*cy) + 0.001;
            const speed = 1.8 + (len / 40); // accelerates as it moves away
            pos[i*3]   += (cx / len) * speed;
            pos[i*3+1] += (cy / len) * speed;
            if (Math.sqrt(cx*cx + cy*cy) < 180) allGone = false;
          }
          particleSystem.geometry.attributes.position.needsUpdate = true;
          if (allGone) pfPhase = 'dispersed';
        }
      }
    }
    renderer.render(scene, camera);
  }
  animate();
})();
</script>

/* ── HOOKS ──────────────────────────────────────────────────────────────── */
function useInView(ref,margin='-40px'){
  const [v,setV]=React.useState(false);
  React.useEffect(()=>{
    if(!ref.current)return;
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting)setV(true)},{threshold:0.1,rootMargin:`0px 0px ${margin} 0px`});
    io.observe(ref.current);return()=>io.disconnect();
  },[]);
  return v;
}
function useCountUp(target,active,dur=1400){
  const[n,setN]=React.useState(0);
  React.useEffect(()=>{
    if(!active||!target)return;
    let s=null;
    const step=ts=>{if(!s)s=ts;const p=Math.min((ts-s)/dur,1);const e=1-Math.pow(1-p,3);setN(Math.round(e*target));if(p<1)requestAnimationFrame(step);else setN(target)};
    requestAnimationFrame(step);
  },[active]);
  return n;
}

function AnimMetric({val,label,color=T.green}){
  const ref=React.useRef(null);const v=useInView(ref);
  const m=val.match(/([\d.]+)/);const num=m?parseFloat(m[1]):null;
  const dec=m?(m[1].includes('.')?m[1].split('.')[1].length:0):0;
  const pre=num!==null?val.slice(0,val.indexOf(m[0])):'';
  const suf=num!==null?val.slice(val.indexOf(m[0])+m[0].length):'';
  const c=useCountUp(num||0,v&&num!==null);
  const disp=num!==null?`${pre}${c.toFixed(dec)}${suf}`:val;
  return(
    <div ref={ref}>

      <div style={{fontFamily:T.mono,fontSize:9,color:T.text3,textTransform:'uppercase',letterSpacing:'0.08em',marginTop:5}}>{label}</div>

}

  const[open,setOpen]=React.useState(null);

  function toggle(i){
    const next = open===i ? null : i;
    if(document.startViewTransition){
      document.startViewTransition(()=>{
        ReactDOM.flushSync(()=>setOpen(next));
      });
    } else {
      setOpen(next);
    }
  }
  const projects=[
    {idx:'01',dom:'Autonomy',c:T.green,n:'Graph-Based RL for UAV Autonomy',tag:'USRCAP Fellowship · $3,000',fr:'Autonomy that holds up when the map runs out.',img:'UAV flight / AirSim simulation',
      m:[['72.8%','Zero-shot deploy'],['97.3%','HITL success'],['<100ms','Intervention']],
      what:'Graph Attention Networks encoded the environment relationally — generalizing across topologies rather than memorizing textures. MAML enabled rapid adaptation to unseen environments. Human-in-the-loop safety gates at sub-100ms ensured any degraded state could be interrupted without vehicle loss.',
      learn:"Zero-shot generalization required structured representations AND a recovery system the team would actually trust. The 97.3% HITL rate proved the boundary between autonomous and human control was designed deliberately.",
      s:['MAML','GAT','PPO','SAC','AirSim','SHAP/LIME']},
    {idx:'02',dom:'Research Tools',c:T.blue,n:'Deep Flyer',tag:'AWS DeepRacer-Inspired UAV Platform',fr:'A training platform so the next experiment starts faster.',img:'Drone + YOLO11 detection overlay',
      m:[['<5ms','Control latency'],['P3O','Policy'],['Zero-shot','Sim-to-real']],
      what:'Direct PX4-ROS2 bridge replaced MAVROS, cutting latency below 5ms — the hard deadline for reactive UAV control. YOLO11 with ZED Mini and OAK-D Pro gave spatial understanding from real-time stereo vision. Reward functions made student-modifiable without touching core code.',
      learn:'The hardest constraint was latency, not accuracy. A well-trained policy at 20ms is a crashed drone. Documentation is infrastructure — the interface was the product.',
      s:['PyTorch','ROS 2','YOLO11','Gazebo','PX4','ZED Mini','NVIDIA Jetson']},
    {idx:'03',dom:'ACM CSUR',c:T.orange,n:'4-Pillars Taxonomy',tag:'ACM Computing Surveys · 2025',fr:'A framework for how deployed intelligence breaks, and why it repeats.',img:'Taxonomy diagram / paper figure',
      m:[['37','AI failures'],['74','Sources'],['ACM','Published']],
      what:'37 documented AI failures organized by mechanism: data-environment mismatch, oversight-gap amplification, distributional brittleness, multi-agent instability. The Contested-Environment Amplifier Model formalized how stressors compound quiet failures into catastrophic ones.',
      learn:'Almost all 37 failures had detectable precursors that appeared normal under standard evaluation. Evaluation environments need to be hostile, not merely representative.',
      s:['Taxonomy Design','Literature Review','AI Safety']},
    {idx:'04',dom:'MLOps',c:T.purple,n:'Homeowner Loss Prediction',tag:'Grange Insurance × UToledo',fr:'Risk modeling as a continuous operating system, not a batch job.',img:'MLflow dashboard / pipeline diagram',
      m:[['R² 0.976','Accuracy'],['75%','Less manual'],['25%','Claim lift']],
      what:'XGBoost with Bayesian optimization. Airflow + MLflow orchestration. AI drift agents triggered retraining. HITL gates required sign-off only on low-confidence predictions — reducing review volume 75% while maintaining oversight where it mattered.',
      learn:"The 75% reduction didn't happen because we removed humans. It happened because we gave humans a better loop to be in.",
      s:['XGBoost','Airflow','MLflow','AWS S3','Bayesian Opt.','CI/CD']},
    {idx:'05',dom:'Infrastructure',c:T.teal,n:'Security Discovery Database',tag:'Park Place Technologies',fr:'Security operations gained one dependable source of truth.',img:'PostgreSQL schema / security UI',
      m:[['15%','Faster response'],['95%','Data integrity'],['Zero','Data loss']],
      what:'Disparate security feeds from Active Directory, Cisco AMP, and Microsoft Defender consolidated into a single PostgreSQL architecture with principled validation and quarterly-tested disaster recovery.',
      learn:"Most data quality problems in security ops aren't adversarial — they're inconsistent tooling assumptions meeting at a data boundary.",
      s:['PostgreSQL','Active Directory','Cisco AMP','Disaster Recovery']},
    {idx:'06',dom:'Hackathon',c:T.green,n:'Deep Truth',tag:'RocketHacks 2025 · Best Use of MongoDB Atlas',fr:'News credibility assessment, built in 24 hours.',img:'DeepTruth UI screenshot',
      m:[['#1','MongoDB Atlas'],['24h','Build sprint']],
      what:'Users submit a news article and get an AI-powered credibility verdict with plain-language explanation and five sourced references. Explainability was a first-class constraint, not a retrofit.',
      learn:'The 24-hour clock produced the best decision: build explainability from the start.',
      s:['MongoDB Atlas','Python','ML','NLP']},
    {idx:'07',dom:'Embedded',c:T.orange,n:'ChemE Car',tag:'AIChE · Most Innovative Design (Worldwide)',fr:'Precision control. No second chances.',img:'ChemE Car hardware / sensors',
      m:[['Worldwide','Most Innovative'],['National','Qualifier']],
      what:'Arduino-based automation integrated pressure sensors, load cells, wheel encoders, IMU, and temperature data into stopping algorithms reliable under live competition conditions.',
      learn:'Competition constraints produce better engineering than open-ended briefs. Design for worst case.',
      s:['Arduino','C/C++','MATLAB','Simulink','Sensor Fusion']},
    {idx:'08',dom:'Civic Tech',c:T.pink,n:'Batting Cleanup',tag:'Toledo Codes · Active Deployment',fr:'QR codes and data science for city maintenance.',img:'QR deployment / city map',
      m:[['Active','Live'],['Toledo','Partnership']],
      what:'QR codes at community locations let residents report issues in seconds. The backend surfaces clusters to prioritize municipal response patterns.',
      learn:'One extra step kills adoption. Infrastructure that generates no data is not data infrastructure.',
      s:['AI','QR Code Tech','Data Science','Project Management']},
  ];
  return(
    <section id="projects" className="section-wash wash-cluster" style={{padding:'100px 52px'}}>
      <div className="section-inner" style={{maxWidth:1280,margin:'0 auto'}}>
        <EL color={T.blue} style={{marginBottom:14}}>Bodies of Work</EL>
        <p style={{fontSize:16,color:T.text2,maxWidth:520,lineHeight:1.6,marginBottom:44}}>Each project a different operating condition. Click to expand the full case study.</p>
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          {projects.map((p,i)=>{
            const isOpen=open===i;
            return(
              <div key={i} className="tilt" style={{background:isOpen?'rgba(255,255,255,0.03)':T.bg,border:`1px solid ${isOpen?p.c+'22':T.border}`,borderRadius:8,overflow:'hidden',cursor:'pointer',transition:'all 0.3s cubic-bezier(0.16,1,0.3,1)',viewTransitionName:`proj-${i}`}}
                onMouseMove={isOpen?undefined:onTilt} onMouseLeave={isOpen?undefined:offTilt}>
                <div onClick={()=>toggle(i)}
                  style={{display:'grid',gridTemplateColumns:'36px 1fr 1fr 110px 30px',gap:16,alignItems:'center',padding:'18px 24px'}}>
                  <span style={{fontFamily:T.mono,fontSize:10,color:T.text3}}>{p.idx}</span>
                  <div style={{display:'flex',alignItems:'center',gap:9}}>
                    <div style={{width:5,height:5,borderRadius:1,background:p.c,flexShrink:0}}></div>
                    <span style={{fontSize:15,fontWeight:600,color:'#fff'}}>{p.n}</span>
                    <span style={{fontFamily:T.mono,fontSize:9,color:T.text3}}>{p.dom}</span>
                  </div>
                  <span className="proj-meta" style={{fontFamily:T.mono,fontSize:9,color:T.text3}}>{p.tag}</span>
                  <span style={{fontFamily:T.sans,fontSize:14,fontWeight:700,color:p.c}}>{p.m[0]?.[0]}</span>
                  <span style={{fontSize:18,color:T.text3,display:'flex',alignItems:'center',justifyContent:'center',transition:'transform 0.3s',transform:isOpen?'rotate(45deg)':'none'}}>+</span>
                </div>
                {isOpen&&(
                  <div style={{padding:'0 24px 32px',borderTop:`1px solid ${T.border}`}}>
                    <p style={{fontSize:17,fontWeight:500,color:T.text,marginTop:20,lineHeight:1.45}}>{p.fr}</p>
                    <div className="two-col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:28,marginTop:24}}>
                      <ImgPh label={p.img} style={{width:'100%',aspectRatio:'16/9'}}/>
                      <div>
                        <div style={{fontFamily:T.mono,fontSize:9,color:T.text3,letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:14}}>Key Metrics</div>
                        <div style={{display:'flex',flexDirection:'column',gap:16}}>
                          {p.m.map(([v,l],j)=><AnimMetric key={j} val={v} label={l} color={p.c}/>)}
                        </div>
                      </div>
                    </div>
                    <div className="two-col" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:36,marginTop:24}}>
                      <div>
                        <div style={{fontFamily:T.mono,fontSize:9,color:T.green,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:8}}>What was built</div>
                        <p style={{fontSize:14,lineHeight:1.8,color:T.text2}}>{p.what}</p>
                      </div>
                      <div>
                        <div style={{fontFamily:T.mono,fontSize:9,color:T.orange,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:8}}>What I learned</div>
                        <p style={{fontSize:14,lineHeight:1.8,color:T.text2}}>{p.learn}</p>
                      </div>
                    </div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:20}}>
                      {p.s.map(s=><Tag key={s} c={p.c}>{s}</Tag>)}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
}

/* ── APP ────────────────────────────────────────────────────────────────── */
function App(){
  React.useEffect(()=>{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:0.07,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    return()=>io.disconnect();
  },[]);
  return(
    <div>
      <Nav/>
      <Hero/>
      <Origin/>
      <Experience/>
      <Projects/>
      <Research/>
      <Skills/>
      <Certifications/>
      <Currently/>
      <Contact/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
