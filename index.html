<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

.wash-deep::before    { background:rgba(6,4,18,0.68); }

.wash-pulse::before   { background:rgba(4,16,12,0.68); }
.wash-warm::before    { background:rgba(18,8,4,0.68); }
.wash-cold::before    { background:rgba(4,8,20,0.70); }

.section-inner{position:relative;z-index:1}

/* Cursor */
#cursor-dot{width:8px;height:8px;background:#4ADE80;border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:screen;transition:background 0.2s}
#cursor-ring{width:32px;height:32px;border:1px solid rgba(74,222,128,0.3);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9998;transform:translate(-50%,-50%) scale(1);transition:transform 0.25s ease,border-color 0.25s}
body:has(a:hover) #cursor-ring,body:has(button:hover) #cursor-ring{transform:translate(-50%,-50%) scale(1.5625);border-color:rgba(74,222,128,0.5)}
@media(max-width:960px){#cursor-dot,#cursor-ring{display:none}body{cursor:auto}}

<body>
<div id="scroll-bar"></div>
<canvas id="space-canvas"></canvas>
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<div id="app-root"><div id="root"></div></div>

<script>
/* ── Decision Graph Background — neural network / knowledge graph ─────────
   Represents the actual structure of Ahmad's work: graph attention networks
   (UAV research), knowledge graphs (agentic AI), decision graphs (HITL).
   Domain-specific. Not interchangeable with any other dark-theme portfolio.
── */
(function() {
  if (!window.THREE) return;
  const THREE = window.THREE;
  const canvas = document.getElementById('space-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x04040A, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1200);
  camera.position.z = 350;

  const isMobile = window.innerWidth < 768;

  // ── NODES ─────────────────────────────────────────────────────────────
  // 90 nodes on desktop / 45 on mobile. Each represents a unit of computation
  // — loosely reflecting the GAT node-based architecture from the UAV research.
  const N = isMobile ? 45 : 90;
  const SPREAD_XY = 560, SPREAD_Z = 190, CONNECT = 135;
  const MAX_E = isMobile ? 70 : 160;

  const pos = [], vel = [], phase = [], nodeColor = [];
  // Signal palette: mostly dim signal-gray, accent nodes in the design colors
  const ACCENT = [0x4ADE80, 0x38BDF8, 0xA78BFA]; // green / blue / violet
  for (let i = 0; i < N; i++) {
    pos.push(new THREE.Vector3(
      (Math.random()-0.5)*SPREAD_XY,
      (Math.random()-0.5)*SPREAD_XY*0.65,
      (Math.random()-0.5)*SPREAD_Z
    ));
    vel.push(new THREE.Vector3(
      (Math.random()-0.5)*0.09,
      (Math.random()-0.5)*0.07,
      (Math.random()-0.5)*0.025
    ));
    phase.push(Math.random()*Math.PI*2);
    const r = Math.random();
    nodeColor.push(new THREE.Color(r<0.07?ACCENT[0]:r<0.13?ACCENT[1]:r<0.17?ACCENT[2]:0x787898));
  }

  // Node geometry (points with per-vertex color + size)
  const nGeo = new THREE.BufferGeometry();
  const nPos = new Float32Array(N*3);
  const nCol = new Float32Array(N*3);
  const nSz  = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    nPos[i*3]=pos[i].x; nPos[i*3+1]=pos[i].y; nPos[i*3+2]=pos[i].z;
    nCol[i*3]=nodeColor[i].r; nCol[i*3+1]=nodeColor[i].g; nCol[i*3+2]=nodeColor[i].b;
    // Accent nodes are larger; dim nodes are smaller
    nSz[i] = nodeColor[i].r > 0.3 ? 2.8+Math.random()*1.4 : 1.0+Math.random()*1.2;
  }
  nGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
  nGeo.setAttribute('color',    new THREE.BufferAttribute(nCol, 3));
  nGeo.setAttribute('size',     new THREE.BufferAttribute(nSz,  1));

  const nVert = `
    attribute float size; attribute vec3 color;
    varying vec3 vColor; varying float vA;
    void main(){
      vColor=color;
      vA=0.5+0.5*(1.0-length(position.xy)/420.0);
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=size*(230.0/-mv.z);
      gl_Position=projectionMatrix*mv;
    }`;
  const nFrag = `
    varying vec3 vColor; varying float vA;
    void main(){
      float d=length(gl_PointCoord-0.5)*2.0;
      float g=pow(1.0-smoothstep(0.0,0.82,d),1.6);
      gl_FragColor=vec4(vColor,g*vA*0.88);
    }`;
  const nMat = new THREE.ShaderMaterial({
    vertexShader:nVert, fragmentShader:nFrag,
    vertexColors:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  const nPts = new THREE.Points(nGeo, nMat);
  scene.add(nPts);

  // ── EDGES ─────────────────────────────────────────────────────────────
  // Dynamic line segments. Rebuilt each frame. Represent active inference
  // pathways — edges only drawn between nodes within CONNECT distance.
  const eGeo = new THREE.BufferGeometry();
  const ePos = new Float32Array(MAX_E*6); // 2 verts × 3 floats
  const eCol = new Float32Array(MAX_E*6);
  const eAlp = new Float32Array(MAX_E*2); // 1 alpha per vertex
  eGeo.setAttribute('position', new THREE.BufferAttribute(ePos, 3));
  eGeo.setAttribute('color',    new THREE.BufferAttribute(eCol, 3));
  eGeo.setAttribute('alpha',    new THREE.BufferAttribute(eAlp, 1));

  const eVert = `
    attribute vec3 color; attribute float alpha;
    varying vec3 vC; varying float vA;
    void main(){ vC=color; vA=alpha; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
  const eFrag = `
    varying vec3 vC; varying float vA;
    void main(){ gl_FragColor=vec4(vC,vA); }`;
  const eMat = new THREE.ShaderMaterial({
    vertexShader:eVert, fragmentShader:eFrag,
    vertexColors:true, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  const eLines = new THREE.LineSegments(eGeo, eMat);
  scene.add(eLines);

  // ── ACTIVATION PULSES ─────────────────────────────────────────────────
  // Occasional bright-edge flashes — simulating signal propagation through
  // the graph (analogous to HITL intervention events in the UAV system).
  let acts = [];

  let t = 0, mx = 0, my = 0;

  if (!isMobile) {
    window.addEventListener('mousemove', e => {
      mx = (e.clientX/window.innerWidth  - 0.5)*0.34;
      my = (e.clientY/window.innerHeight - 0.5)*0.22;
    });
  }

  window.addEventListener('scroll', () => {
    const p = window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight);
    const bar = document.getElementById('scroll-bar');
    if (bar) bar.style.transform = `scaleX(${p})`;
  }, { passive: true });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
  renderer.setSize(window.innerWidth, window.innerHeight);

  function animate() {
    requestAnimationFrame(animate);
    t += 0.007;

    // Camera gentle drift + mouse parallax
    camera.rotation.y += (mx*0.036 - camera.rotation.y)*0.04;
    camera.rotation.x += (-my*0.024 - camera.rotation.x)*0.04;
    camera.position.x += Math.sin(t*0.11)*0.08;
    camera.position.y += Math.cos(t*0.09)*0.06;
    // Subtle depth shift with scroll
    const scrollP = window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight);
    camera.position.z += (350 - scrollP*55 - camera.position.z)*0.02;

    // Update node positions
    const BX=SPREAD_XY*0.52, BY=SPREAD_XY*0.38, BZ=SPREAD_Z*0.56;
    for (let i = 0; i < N; i++) {
      pos[i].x += vel[i].x + Math.sin(t*0.28+phase[i])*0.042;
      pos[i].y += vel[i].y + Math.cos(t*0.22+phase[i])*0.036;
      pos[i].z += vel[i].z;
      if (Math.abs(pos[i].x) > BX) vel[i].x *= -0.85;
      if (Math.abs(pos[i].y) > BY) vel[i].y *= -0.85;
      if (Math.abs(pos[i].z) > BZ) vel[i].z *= -0.85;
      nPos[i*3]=pos[i].x; nPos[i*3+1]=pos[i].y; nPos[i*3+2]=pos[i].z;
    }
    nGeo.attributes.position.needsUpdate = true;

    // Random activation pulse
    if (Math.random() < 0.018 && acts.length < 5) {
      const ai = Math.floor(Math.random()*N);
      const aj = Math.floor(Math.random()*N);
      if (ai !== aj) acts.push({ i:ai, j:aj, t:0, max:52 });
    }
    acts = acts.filter(a => a.t < a.max);
    acts.forEach(a => a.t++);

    // Rebuild edges
    let ec = 0;
    for (let i = 0; i < N && ec < MAX_E; i++) {
      for (let j = i+1; j < N && ec < MAX_E; j++) {
        const dx=pos[i].x-pos[j].x, dy=pos[i].y-pos[j].y, dz=pos[i].z-pos[j].z;
        const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
        if (dist < CONNECT) {
          const base=ec*6, va=ec*2;
          const proximity = 1 - dist/CONNECT;
          const isAct = acts.some(a=>(a.i===i&&a.j===j)||(a.i===j&&a.j===i));
          const alpha = isAct ? 0.52 : proximity*0.17;
          const col   = isAct ? [0.29,0.87,0.50] : [0.44,0.44,0.60];
          ePos[base]=pos[i].x;   ePos[base+1]=pos[i].y;   ePos[base+2]=pos[i].z;
          ePos[base+3]=pos[j].x; ePos[base+4]=pos[j].y;   ePos[base+5]=pos[j].z;
          eCol[base]=col[0]; eCol[base+1]=col[1]; eCol[base+2]=col[2];
          eCol[base+3]=col[0];eCol[base+4]=col[1];eCol[base+5]=col[2];
          eAlp[va]=alpha; eAlp[va+1]=alpha;
          ec++;
        }
      }
    }
    eGeo.attributes.position.needsUpdate=true;
    eGeo.attributes.color.needsUpdate=true;
    eGeo.attributes.alpha.needsUpdate=true;
    eGeo.setDrawRange(0, ec*2);

    renderer.render(scene, camera);
  }
  animate();
})();
</script>

function useInView(ref,margin='-40px'){
  const [v,setV]=React.useState(false);

  },[]);

}
function useCountUp(target,active,dur=1400){
  const[n,setN]=React.useState(0);
  React.useEffect(()=>{
    if(!active||!target)return;
    let s=null;
    const step=ts=>{if(!s)s=ts;const p=Math.min((ts-s)/dur,1);const e=1-Math.pow(1-p,3);setN(Math.round(e*target));if(p<1)requestAnimationFrame(step);else setN(target)};

}

function App(){

    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    return()=>io.disconnect();
  },[]);
  return(
    <div>
      <Nav/>
      <Hero/>
      <Origin/>
      <Experience/>
      <Projects/>
      <Research/>
      <Skills/>
      <Now/>
      <Contact/>

  );
}
