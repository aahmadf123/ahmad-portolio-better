*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ── Cursor ── */
#cursor-dot{width:7px;height:7px;background:var(--amber);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}

/* ── Scroll progress bar ── */
#scroll-bar{position:fixed;top:0;left:0;height:2px;background:var(--amber);opacity:.85;z-index:9997;transform-origin:left;transform:scaleX(0);transition:transform 0.06s linear;pointer-events:none}

/* ── Reveal ── */
.reveal{opacity:0;transform:translateY(22px);transition:opacity 0.8s cubic-bezier(0.16,1,0.3,1),transform 0.8s cubic-bezier(0.16,1,0.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}
.rd1{transition-delay:0.08s}.rd2{transition-delay:0.16s}.rd3{transition-delay:0.24s}.rd4{transition-delay:0.32s}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none!important;transition:none!important}*{transition:none!important;animation:none!important}}

/* ── Pulse ── */
@keyframes pulse-a{0%{box-shadow:0 0 0 0 rgba(240,180,41,0.5)}70%{box-shadow:0 0 0 7px rgba(240,180,41,0)}100%{box-shadow:0 0 0 0 rgba(240,180,41,0)}}
.pulse{animation:pulse-a 2.4s ease-out infinite}

/* ── Tilt ── */
.tilt{transition:transform 0.25s ease,box-shadow 0.25s ease}
.tilt:hover{box-shadow:0 18px 44px rgba(0,0,0,0.5)}

/* ── Corner brackets on hover ── */
.bracket{position:relative}
.bracket::before,.bracket::after{content:'';position:absolute;width:14px;height:14px;opacity:0;transition:opacity 0.25s,transform 0.25s;z-index:2}
.bracket::before{top:-2px;left:-2px;border-top:2px solid var(--amber);border-left:2px solid var(--amber);transform:translate(4px,4px)}
.bracket::after{bottom:-2px;right:-2px;border-bottom:2px solid var(--amber);border-right:2px solid var(--amber);transform:translate(-4px,-4px)}
.bracket:hover::before,.bracket:hover::after{opacity:1;transform:translate(0,0)}
@media(hover:none){.bracket::before,.bracket::after{display:none}}

/* ── Image placeholder ── */

<script>
(function(){
  const dot=document.getElementById('cursor-dot');
  const ring=document.getElementById('cursor-ring');
  if(!dot)return;
  let rx=0,ry=0,tx=0,ty=0;
  document.addEventListener('mousemove',e=>{tx=e.clientX;ty=e.clientY;dot.style.left=tx+'px';dot.style.top=ty+'px'});
  (function lerp(){rx+=(tx-rx)*0.13;ry+=(ty-ry)*0.13;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lerp)})();
  window.addEventListener('scroll',()=>{
    const p=window.scrollY/Math.max(1,document.body.scrollHeight-window.innerHeight);
    const b=document.getElementById('scroll-bar');
    if(b)b.style.transform='scaleX('+p+')';
  },{passive:true});
})();
</script>

<script type="text/babel">
const T={
  amber:'#F0B429',blue:'#4B7BF5',teal:'#2DD4C8',orange:'#F07832',purple:'#A78BFA',pink:'#F472B6',
  bg:'#0B0D14',surf:'#131520',surf2:'#1A1D2C',
  text:'#F2EDD8',text2:'#B8B4A4',text3:'#6E6B60',
  bd:'rgba(242,237,216,0.08)',bd2:'rgba(242,237,216,0.15)',
  serif:"'Fraunces',Georgia,serif",mono:"'Space Mono',monospace",sans:"'Plus Jakarta Sans',sans-serif"
};

function useInView(ref,margin='-40px'){
  const[v,setV]=React.useState(false);
  React.useEffect(()=>{
    if(!ref.current)return;
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting)setV(true)},{threshold:0.1,rootMargin:`0px 0px ${margin} 0px`});
    io.observe(ref.current);return()=>io.disconnect();
  },[]);
  return v;
}
function useCountUp(target,active,dur=1400){
  const[n,setN]=React.useState(0);
  React.useEffect(()=>{
    if(!active||!target)return;
    let s=null;
    const step=ts=>{if(!s)s=ts;const p=Math.min((ts-s)/dur,1);const e=1-Math.pow(1-p,3);setN(Math.round(e*target));if(p<1)requestAnimationFrame(step);else setN(target)};
    requestAnimationFrame(step);
  },[active]);
  return n;
}

function ImgPh({label,style={},className='',slots=1,images=[]}){
  const hasImgs=images&&images.length>0;
  const count=hasImgs?images.length:slots;
  const[idx,setIdx]=React.useState(0);
  const go=(dir,e)=>{if(e)e.stopPropagation();setIdx(i=>(i+dir+count)%count)};
  const nav=count>1&&<>
    <button onClick={e=>go(-1,e)} aria-label="Previous"
      style={{position:'absolute',left:8,top:'50%',transform:'translateY(-50%)',background:'rgba(11,13,20,0.88)',border:'1px solid rgba(242,237,216,0.14)',color:T.text2,borderRadius:4,width:28,height:28,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,zIndex:3,lineHeight:1,padding:0}}>&#8592;</button>
    <button onClick={e=>go(1,e)} aria-label="Next"
      style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'rgba(11,13,20,0.88)',border:'1px solid rgba(242,237,216,0.14)',color:T.text2,borderRadius:4,width:28,height:28,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,zIndex:3,lineHeight:1,padding:0}}>&#8594;</button>
    <div style={{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',display:'flex',gap:4,zIndex:3}}>
      {Array.from({length:count}).map((_,i)=>(
        <div key={i} onClick={e=>{e.stopPropagation();setIdx(i)}}
          style={{width:14,height:4,borderRadius:3,background:i===idx?T.amber:'rgba(242,237,216,0.2)',cursor:'pointer',transformOrigin:'left center',transform:i===idx?'scaleX(1)':'scaleX(0.4)',transition:'transform 0.25s,background 0.25s'}}/>
      ))}
    </div>
  </>;
  if(hasImgs)return(
    <div style={{position:'relative',overflow:'hidden',borderRadius:8,background:'#0d0f1a',...style}} className={className}>
      <img src={images[idx]} alt={label} style={{width:'100%',height:'100%',objectFit:'contain',display:'block'}}/>
      {nav}
    </div>
  );
  return(
    <div className={`img-ph${className?' '+className:''}`} style={style}>
      <span style={{zIndex:1}}>{label}{count>1?` · ${idx+1}/${count}`:''}</span>
      {nav}
    </div>
  );
}

function Tag({c=T.blue,children}){
  const bg=c===T.amber?'rgba(240,180,41,0.08)':c===T.orange?'rgba(240,120,50,0.08)':c===T.purple?'rgba(167,139,250,0.08)':c===T.pink?'rgba(244,114,182,0.08)':c===T.teal?'rgba(45,212,200,0.08)':'rgba(75,123,245,0.08)';
  return<span style={{fontFamily:T.mono,fontSize:11,padding:'4px 9px',background:bg,border:`1px solid ${c}22`,borderRadius:4,color:c,letterSpacing:'0.03em'}}>{children}</span>;
}

function onTilt(e){const el=e.currentTarget;const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-0.5;const y=(e.clientY-r.top)/r.height-0.5;el.style.transform=`perspective(900px) rotateX(${-y*5}deg) rotateY(${x*6}deg) translateY(-1px)`}
function offTilt(e){e.currentTarget.style.transform=''}

function AnimMetric({val,label,color=T.amber}){
  const ref=React.useRef(null);const v=useInView(ref);
  const m=val.match(/([\d.]+)/);const num=m?parseFloat(m[1]):null;
  const dec=m?(m[1].includes('.')?m[1].split('.')[1].length:0):0;
  const pre=num!==null?val.slice(0,val.indexOf(m[0])):'';
  const suf=num!==null?val.slice(val.indexOf(m[0])+m[0].length):'';
  const c=useCountUp(num||0,v&&num!==null);
  return(
    <div ref={ref}>
      <div style={{fontFamily:T.serif,fontStyle:'italic',fontSize:28,fontWeight:700,color:T.text,letterSpacing:'-0.02em',lineHeight:1}}>{num!==null?`${pre}${c.toFixed(dec)}${suf}`:val}</div>
      <div style={{fontFamily:T.mono,fontSize:9,color:T.text3,textTransform:'uppercase',letterSpacing:'0.08em',marginTop:5}}>{label}</div>
    </div>
  );
}

/* Section header with watermark number */
function SH({n,label,sub='',c=T.amber}){

        </div>
        {sub&&<p style={{fontSize:15,color:T.text2,maxWidth:460,lineHeight:1.65,marginTop:4}}>{sub}</p>}
      </div>
    </div>
  );
}

/* ── NAV ── */
function Nav(){
  const[sc,setSc]=React.useState(false);
  const[open,setOpen]=React.useState(false);
  const[active,setActive]=React.useState('');
  React.useEffect(()=>{const h=()=>setSc(window.scrollY>80);window.addEventListener('scroll',h,{passive:true});return()=>window.removeEventListener('scroll',h)},[]);
  React.useEffect(()=>{
    const ids=['origin','experience','projects','research','skills','contact'];
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setActive('#'+e.target.id)})},{threshold:0,rootMargin:'-60px 0px -60% 0px'});
    ids.forEach(id=>{const el=document.getElementById(id);if(el)io.observe(el)});
    return()=>io.disconnect();
  },[]);
  const ls=[['About','#origin'],['Experience','#experience'],['Work','#projects'],['Research','#research'],['Capabilities','#skills'],['Contact','#contact'],['Docs','docs.html']];
  return(
    <nav style={{
      position:'fixed',top:0,left:0,right:0,zIndex:200,
      padding:'0 52px',
      background:sc?'rgba(11,13,20,0.92)':'transparent',
      backdropFilter:sc?'blur(20px)':'none',
      WebkitBackdropFilter:sc?'blur(20px)':'none',
      borderBottom:sc?`1px solid rgba(240,180,41,0.12)`:'1px solid transparent',
      transition:'background 0.4s,border-color 0.4s',
      borderTop:'2px solid var(--amber)'
    }}>
      <div style={{maxWidth:1280,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',height:60}}>
        <a href="#" style={{display:'flex',alignItems:'center',gap:9}}>
          <div className="pulse" style={{width:7,height:7,background:T.amber,borderRadius:1,flexShrink:0}}></div>
          <span style={{fontFamily:T.serif,fontStyle:'italic',fontSize:17,fontWeight:700,letterSpacing:'-0.01em',color:T.text}}>Ahmad.dev</span>
        </a>
        <div className={`nav-links${open?' open':''}`} style={{gap:28,alignItems:'center'}}>
          {ls.map(([l,h],i)=>{
            const isA=active===h;
            return(
              <a key={i} href={h} onClick={()=>setOpen(false)}
                style={{fontFamily:T.mono,fontSize:11,letterSpacing:'0.07em',color:isA?T.amber:T.text3,textTransform:'uppercase',transition:'color 0.2s',borderBottom:`1px solid ${isA?T.amber+'55':'transparent'}`,paddingBottom:2}}
                onMouseEnter={e=>{e.target.style.color=T.amber}}
                onMouseLeave={e=>{e.target.style.color=isA?T.amber:T.text3}}
              >{l}</a>
            );
          })}
        </div>
        <button className="nav-hamburger" onClick={()=>setOpen(o=>!o)} aria-label="Toggle navigation" style={{display:'none'}}>
          <span style={{transform:open?'rotate(45deg) translateY(6.5px)':'none'}}></span>
          <span style={{opacity:open?0:1,margin:'3.5px 0'}}></span>
          <span style={{transform:open?'rotate(-45deg) translateY(-6.5px)':'none'}}></span>
        </button>
      </div>
    </nav>
  );
}

function Hero(){
  const[rdy,setRdy]=React.useState(false);
  React.useEffect(()=>{setTimeout(()=>setRdy(true),220)},[]);

function App(){

    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:0.07,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    return()=>io.disconnect();
  },[]);
  return(
    <div>

      <Origin/>
      <Experience/>
      <Projects/>
      <Research/>
      <Skills/>

}
